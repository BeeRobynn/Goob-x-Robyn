    damageContainer: Biological
    damageModifierSet: Scale
  - type: LanguageSpeaker # Einstein Engines - Language
  - type: LanguageKnowledge # Einstein Engines - Language
    speaks:
    - TauCetiBasic # Replacement Accent will have to do for now until custom language.
    understands:
    - TauCetiBasic # Replacement Accent will have to do for now until custom language.
  - type: Body
    prototype: Animal
    bodyType: Simple
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: Perishable
  - type: Visibility
    layer: 128 # VisibilityFlags.EldritchInfluence.Spent