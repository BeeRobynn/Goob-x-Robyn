    makeSentient: true
    allowMovement: true
    allowSpeech: true
    name: ghost-role-information-yellowrat-name
    description: ghost-role-information-yellowrat-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
  - type: GhostTakeoverAvailable
  - type: MovementSpeedModifier
